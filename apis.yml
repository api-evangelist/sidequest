name: SideQuest
description: >-
  SideQuest is a VR content-discovery platform and independent app store for Meta
  Quest, PCVR, Pico, Magic Leap and WebXR headsets — the home of sideload-only,
  early-access and indie VR apps and games, plus tools to help users get more from
  their VR headset. SideQuest operates a public REST API (api.sidequestvr.com) for
  browsing the app catalog and reading user profiles and achievements, secured with
  OAuth 2.0 bearer tokens and a device-style short-code login. Backed by GV.
